<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="static/U-Control-ico.ico">
    <title>Dashboard - U-Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Cores e fontes */
        :root {
            --background-color: #1a1a1a;
            --card-bg: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            --primary-color: #4a90e2;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --white-color: #ffffff;
            --text-secondary: #b0b0b0;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background-color);
            color: var(--white-color);
            font-family: var(--font-family);
            padding: 20px;
            min-height: 100vh;
        }

        /* Container do Dashboard */
        .dashboard-container {
            text-align: center;
            background-color: var(--secondary-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 40px auto;
        }

        /* Títulos e textos */
        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Link para a Home */
        .home-link {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        /* Botão de Logout */
        .logout-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: var(--white-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #0097a7;
        }

        /* Ícone do Dashboard */
        .icon {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        /* Container e estilo dos QR Codes */
        .qrcode-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .qrcode {
            width: 120px;
            height: 120px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            background-color: var(--white-color);
            text-align: center;
            padding: 10px;
        }

        .qrcode img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qrcode p {
            font-size: 1rem;
            color: var(--primary-color);
            margin-top: 10px;
            font-weight: bold;
        }

        /* Estilo do Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal img {
            width: 80%; /* Tamanho da imagem */
            max-width: 600px; /* Tamanho máximo da imagem */
            height: auto;
            border-radius: 8px;
        }

        .modal .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: var(--white-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="icon">
            <i class="fas fa-tachometer-alt"></i> <!-- Ícone de dashboard -->
        </div>
        <h1>Bem-vindo, {{ current_user.username }}!</h1>
        <p>Clique nas fotos abaixo para ampliar os códigos e exibir as rotas que você pode acessar.</p>

        <!-- Link para a Home -->
        <a href="/" class="home-link">
            <i class="fas fa-home"></i> Ir para Controle
        </a>

        <!-- Botão de Logout abaixo -->
        <a href="{{ url_for('auth.logout') }}">
            <button class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </a>
    </div>

    <!-- Exibindo os QR Codes -->
    <div class="qrcode-container">
        <div class="qrcode">
            <a href="#" onclick="openModal('root_qr_code')">
                <img src="/static/qrcodes/root_qr_code.png" alt="Control">
            </a>
            <a href="/"><p>Controle</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('monitor_qr_code')">
                <img src="/static/qrcodes/monitor_qr_code.png" alt="Monitor">
            </a>
            <a href="/monitor"><p>Monitor</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('presenter_qr_code')">
                <img src="/static/qrcodes/presenter_qr_code.png" alt="Presenter">
            </a>
            <a href="/presenter"><p>Controle de Imagem</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('order_qr_code')">
                <img src="/static/qrcodes/order_qr_code.png" alt="Ordem do Culto">
            </a>
            <a href="/order"><p>Ordem do Culto</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('view_qr_code')">
                <img src="/static/qrcodes/view_qr_code.png" alt="Cifra">
            </a>
            <a href="/view"><p>Cifra</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('img_qr_code')">
                <img src="/static/qrcodes/img_qr_code.png" alt="Monitor de Imagem">
            </a>
            <a href="/img"><p>Monitor de Imagem</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('songs_qr_code')">
                <img src="/static/qrcodes/songs_qr_code.png" alt="Biblioteca de Músicas">
            </a>
            <a href="/songs"><p>Biblioteca de Músicas</p></a>
        </div>
        <div class="qrcode">
            <a href="#" onclick="openModal('help_qr_code')">
                <img src="/static/qrcodes/help_qr_code.png" alt="Ajuda">
            </a>
            <a href="/help"><p>Ajuda</p></a>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modal-img" class="modal-content" src="" alt="QR Code Enlarged">
    </div>

    <script>
        function openModal(imageId) {
            var modal = document.getElementById('modal');
            var modalImg = document.getElementById('modal-img');
            modal.style.display = "flex"; // Alterado para flex
            modalImg.src = "/static/qrcodes/" + imageId + ".png";
        }

        function closeModal() {
            var modal = document.getElementById('modal');
            modal.style.display = "none";
        }

        // Adicionando evento para fechar o modal com a tecla Esc
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
