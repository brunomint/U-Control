<!DOCTYPE html>
<html lang="{{ uc_lang_tag }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ versioned_static('js/csrf.js') }}"></script>
    {% include "_i18n.html" %}
    <link rel="icon" type="image/x-icon" href="/static/U-Control-ico.ico">
    <title>{{ _('Exibição de Letras') }}</title>
    <script src="/static/vendor/socketio/socket.io.min.js"></script>
    <script src="/static/vendor/jquery/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{{ versioned_static('css/pages/display_public.css') }}">
</head>
<body>
    <div id="ticker-bar"><span id="ticker-text"></span></div>
    <video id="screenShareVideo"
        style="display:none; position:fixed; inset:0; width:100%; height:100%;
               object-fit:contain; background:#000; z-index:50;"
        autoplay playsinline></video>
    <!-- Camada de mídia (imagem / vídeo) -->
    <div id="media-layer">
        <img id="media-img" src="" alt="">
        <video id="media-video" autoplay playsinline></video>
    </div>

    <!-- Camada de rota (relógio, bíblia, imagem, etc.) -->
    <iframe id="route-layer" src="about:blank" style="display:none; position:fixed; inset:0; width:100%; height:100%; border:none; z-index:2;"></iframe>

    <div id="lyrics">
        <div id="bible-reference" style="display:none;"></div>
        <div id="section-text"></div>
        <div id="bible-version" style="display:none;"></div>
    </div>

    <!-- Tela preta (botão do /control e /presenter): cobre tudo, inclusive letra, rotas e aviso -->
    <div id="blackout-layer"></div>

    <script src="{{ versioned_static('js/chord_lines.js') }}"></script>
    <script src="{{ versioned_static('js/zoom_fit.js') }}"></script>
    <script src="{{ versioned_static('js/tela_cheia.js') }}"></script>
    <script src="{{ versioned_static('js/screen_share_viewer.js') }}"></script>
    <script src="{{ versioned_static('js/pages/display_public.js') }}"></script>
</body>
</html>
