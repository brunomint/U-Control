<!DOCTYPE html>
<html lang="{{ uc_lang_tag }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ versioned_static('js/csrf.js') }}"></script>
    <link rel="icon" type="image/x-icon" href="/static/U-Control-ico.ico">
    <title>{{ _('Monitor de Imagens') }}</title>

    <link rel="stylesheet" href="{{ versioned_static('css/pages/img.css') }}">

    <link rel="stylesheet" href="{{ versioned_static('css/camada_neutra.css') }}">

    <!-- Inclusão do Socket.IO -->
    <script src="/static/vendor/socketio/socket.io.min.js"></script>
</head>
<body>

    <!-- Tag img para exibir a imagem atual -->
    <img id="imageUr" alt="{{ _('Foto Atual') }}" style="display:none;">

    <!-- Tag video para exibir vídeos. Sem 'muted' para permitir som quando autoplay-policy=no-user-gesture-required estiver ativo. -->
    <video id="videoEl" style="display:none; width:100%; height:100%; object-fit:contain;" playsinline></video>

    <script src="{{ versioned_static('js/zoom_fit.js') }}"></script>
    <script src="{{ versioned_static('js/camada_neutra.js') }}"></script>
    <script src="{{ versioned_static('js/pages/img.js') }}"></script>

</body>
</html>
