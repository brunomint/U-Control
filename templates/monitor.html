<!DOCTYPE html>
<html lang="{{ uc_lang_tag }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ versioned_static('js/csrf.js') }}"></script>
    {% include "_i18n.html" %}
    <link rel="icon" type="image/x-icon" href="/static/U-Control-ico.ico">
    <title>{{ _('Monitor') }}</title>
    <link rel="stylesheet" href="{{ versioned_static('css/pages/monitor.css') }}">
    <link rel="stylesheet" href="{{ versioned_static('css/camada_neutra.css') }}">
    <script src="/static/vendor/socketio/socket.io.min.js"></script>
</head>
<body>

    <div id="ticker-bar"><span id="ticker-text"></span></div>
    <video id="screenShareVideo"
        style="display:none; position:fixed; inset:0; width:100%; height:100%;
               object-fit:contain; background:#000; z-index:50;"
        autoplay playsinline></video>

    <!-- Container para a imagem e os iframes -->
    <div class="iframe-container" id="iframeContainer">
        <!-- Imagem que será exibida se o link for uma imagem -->
        <img id="displayImage" src="" alt="{{ _('Imagem') }}" class="responsive-image">

        <!-- Vídeo controlado pelos comandos do /presenter e / -->
        <video id="displayVideo" style="display:none; width:100%; height:100%; object-fit:contain; background:#000;"
               playsinline></video>

        <!-- Iframes para exibir URLs -->
        <iframe id="monitorIframe1" src="about:blank" title="{{ _('Iframe Esquerdo') }}"></iframe>
        <iframe id="monitorIframe2" src="about:blank" title="{{ _('Iframe Direito') }}"></iframe>
    </div>

    <script src="{{ versioned_static('js/zoom_fit.js') }}"></script>
    <script src="{{ versioned_static('js/tela_cheia.js') }}"></script>
    <script src="{{ versioned_static('js/screen_share_viewer.js') }}"></script>
    <script src="{{ versioned_static('js/camada_neutra.js') }}"></script>
    <script src="{{ versioned_static('js/video_sync.js') }}"></script>
    <script src="{{ versioned_static('js/pages/monitor.js') }}"></script>
</body>
</html>
