<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/U-Control-ico.ico">
    <title>Apresentação</title>
    <script src="/static/vendor/socketio/socket.io.min.js"></script>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        {#- pointer-events: none — clique ou toque na tela não avança só esta
            tela (o tocador do LibreOffice avança com clique); quem avança é
            o Controle, pra todas juntas #}
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
                 pointer-events: none; visibility: hidden; }
        p { position: fixed; inset: 0; display: grid; place-items: center; margin: 0;
            color: #666; font: 600 clamp(14px, 3vw, 28px) system-ui, sans-serif; text-align: center; padding: 16px; }
        p[hidden] { display: none; }  /* o display: grid acima ganhava do atributo hidden */
    </style>
</head>
<body>
    {#- PowerPoint animado (ver blueprints/apresentacao.py): o SVG que o
        LibreOffice gera traz o tocador dele (aSlideShow, nCurSlide,
        theMetaDoc); esta página só o comanda. #}
    <iframe id="tocador" title="Apresentação"></iframe>
    <p id="aviso">Carregando a apresentação…</p>
    <script src="{{ versioned_static('js/pages/apresentacao.js') }}"></script>
</body>
</html>
