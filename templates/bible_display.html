{% extends "base.html" %}

{% block title %}Bíblia - Display{% endblock %}

{% block head_extra %}
<link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ versioned_static('css/pages/bible_display.css') }}">
{% endblock %}

{% block content %}
<div class="container" id="container">
    <div class="waiting" id="waiting">
        <i class="fas fa-book-bible"></i>
        <p>Aguardando versículos...</p>
    </div>

    <div id="content" style="display: none;">
        <div class="reference" id="reference"></div>
        <div class="verse-container">
            <div class="verse-text" id="verseText"></div>
        </div>
        <div class="version" id="verseVersion"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/socketio/socket.io.min.js"></script>
<script src="{{ versioned_static('js/pages/bible_display.js') }}"></script>
{% endblock %}
