<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar data da agenda</title>
    <link rel="icon" type="image/x-icon" href="/static/U-Control-ico.ico">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f5f7fa; color: #0f172a; }
        .page { max-width: 520px; margin: 48px auto; padding: 0 16px; }
        .card { background: white; border-radius: 14px; padding: 22px; box-shadow: 0 12px 30px rgba(15,23,42,0.08); }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { margin: 0 0 18px; color: #475569; }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input[type="date"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 15px; background: #f8fafc; }
        button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: #0ea5e9; color: white; font-weight: 700; cursor: pointer; box-shadow: 0 10px 22px rgba(14,165,233,0.3); }
        button:hover { box-shadow: 0 12px 28px rgba(14,165,233,0.35); }
        a.back { display: inline-block; margin-top: 12px; color: #0ea5e9; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>Editar agenda</h1>
        <p>Escolha a data para editar a ordem/agenda correspondente.</p>
        <form method="POST">
            <label for="date">Data</label>
            <input type="date" id="date" name="date" required>
            <button type="submit">Abrir edição</button>
        </form>
        <a class="back" href="/agenda">← Voltar para calendário</a>
    </div>
</div>
</body>
</html>
