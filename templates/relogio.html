<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e90ff, #4b0082);
            color: white;
            font-family: 'SF Pro Display', Arial, sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .date {
            font-size: 24px;
            font-weight: 400;
        }
        .time {
            font-size: 96px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', options);
            document.getElementById('time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
