<!DOCTYPE html>
<html lang="pt-BR">
<head>
    {% include "lite/_cabeca.html" %}
    <title>{{ 'Monitor do palco' if tela == 'monitor' else 'Telão do público' }} - U-Control</title>
</head>
<body class="lite-tela lite-tela-{{ tela }}" data-tela="{{ tela }}">
<div id="palco" class="lite-palco">
    <div id="conteudo" class="lite-conteudo"><p class="lite-espera">Carregando…</p></div>
</div>
<div id="semConexao" class="lite-sem-conexao" hidden>Sem conexão com o U-Control. Tentando de novo…</div>
<a class="lite-trocar" href="{{ url_for('lite.inicio', escolher=1) }}">trocar tela</a>
<noscript><p class="lite-espera">Esta tela precisa do JavaScript ligado no navegador para atualizar sozinha.</p></noscript>
<script src="{{ versioned_static('lite/tela.js') }}"></script>
</body>
</html>
