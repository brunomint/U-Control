<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="static/U-Control-ico.ico">
    <title>Login</title>
    <!-- Link para o Bootstrap -->
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222222; /* Fundo escuro */
            color: white; /* Texto branco */
        }
        .login-container {
            background: #333; /* Fundo do container */
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0, 0, 0, 0.2); /* Box shadow mais evidente */
            max-width: 400px;
            width: 100%;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1rem;
        }
        .logo-container img {
            max-width: 110px;
            height: auto;
        }
        .logo-container .logo-name {
            color: #00bcd4;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        .form-control:focus {
            border-color: #7c7f81; /* Borda mais clara ao focar */
            box-shadow: 0 0 10px rgba(124, 127, 129, 0.8); /* Leve brilho no foco */
        }
    </style>
    
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="/static/U-Control.png" alt="U Control">
            <p class="logo-name">U-Control</p>
        </div>
        <h2 class="text-center mb-4">Login</h2>
        <form method="POST" action="/login">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert alert-danger mt-3" role="alert">
                {% for category, message in messages %}
                    <p class="{{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
    </div>

    <!-- Script do Bootstrap -->
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
