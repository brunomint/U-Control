# U-Control para CasaOS: no painel, App Store → "+" (Custom Install) →
# Import, e cole este arquivo ou o endereço dele:
#   https://brunomint.github.io/U-Control/casaos/docker-compose.yml
# Os dados ficam em /DATA/AppData/u-control. Depois de instalar, abra
# http://<ip-do-servidor>:8585 e crie o primeiro usuário.
name: u-control
services:
  u-control:
    container_name: u-control
    image: ghcr.io/brunomint/u-control:latest
    # host: as telas e o celular acham o servidor na rede (e o
    # ucontrol.local funciona); a porta é a 8585 do próprio servidor.
    network_mode: host
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: /DATA/AppData/u-control/instance
        target: /app/instance
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/u-control/imagens
        target: /app/static/imagens
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/u-control/audio
        target: /app/static/audio
        bind:
          create_host_path: true
    restart: unless-stopped
    x-casaos:
      volumes:
        - container: /app/instance
          description:
            en_us: Database and settings
            pt_br: Banco de dados e configurações
        - container: /app/static/imagens
          description:
            en_us: Photos and slides
            pt_br: Fotos e slides
        - container: /app/static/audio
          description:
            en_us: Downloaded audio
            pt_br: Áudios baixados

x-casaos:
  architectures:
    - amd64
    - arm64
  main: u-control
  author: brunomint
  developer: brunomint
  category: Utilities
  icon: https://brunomint.github.io/U-Control/imagens/logo.png
  screenshot_link:
    - https://brunomint.github.io/U-Control/imagens/controle.png
    - https://brunomint.github.io/U-Control/imagens/monitor-cifra.png
  tagline:
    en_us: Church presentation software controlled from any phone
    pt_br: Projeção para igrejas controlada de qualquer celular
  description:
    en_us: Lyrics with chords, Bible, photos, videos and PowerPoint on the big screen and the stage monitor, controlled from any phone, tablet or PC on the network.
    pt_br: Letra com cifra, Bíblia, fotos, vídeos e PowerPoint no telão e no retorno de palco, controlados de qualquer celular, tablet ou PC da rede.
  title:
    en_us: U-Control
  index: /
  port_map: "8585"
