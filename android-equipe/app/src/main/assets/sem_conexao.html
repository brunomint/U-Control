<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #fff; font-family: sans-serif; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 28px; }
  .caixa { text-align: center; max-width: 380px; width: 100%; }
  .icone { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 21px; margin-bottom: 10px; }
  p { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.55; margin-bottom: 24px; }
  button { display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px;
           font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .tentar { background: #00bcd4; color: #fff; }
  .menu { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="caixa">
  <div class="icone">📡</div>
  <h1>Sem conexão com {{IGREJA}}</h1>
  <p>Confira se o celular está no Wi-Fi da igreja ou com internet, e se o U-Control está ligado.</p>
  <button class="tentar" onclick="UCApp.tentarDeNovo('{{URL_JS}}')">Tentar de novo</button>
  <button class="menu" onclick="UCApp.voltarAoMenu()">Voltar ao menu</button>
</div>
</body>
</html>
